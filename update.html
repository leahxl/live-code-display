<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>更新数字</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f9f9f9;
    }
    h1 {
      margin-bottom: 1em;
    }
    input {
      font-size: 2em;
      width: 200px;
      text-align: center;
      padding: 0.3em;
      margin-bottom: 1em;
      border: 2px solid #ccc;
      border-radius: 5px;
    }
    button {
      font-size: 1.2em;
      padding: 0.5em 1.5em;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #status {
      margin-top: 1em;
      font-size: 1em;
    }
  </style>
</head>
<body>
  <h1>更新六位数字</h1>
  <input id="numInput" maxlength="6" placeholder="请输入数字" />
  <button onclick="updateCode()">提交</button>
  <div id="status"></div>

  <script>
    async function updateCode() {
      const code = document.getElementById("numInput").value;
      const status = document.getElementById("status");

      if (!/^\d{6}$/.test(code)) {
        status.textContent = "请输入 6 位数字";
        status.style.color = "red";
        return;
      }

      try {
        const response = await fetch("https://gh-updater-i272rs788-leahxls-projects.vercel.app/api/update", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code })
        });

        const result = await response.json();
        if (response.ok) {
          status.textContent = "更新成功：" + code;
          status.style.color = "green";
        } else {
          status.textContent = result.message || "更新失败";
          status.style.color = "red";
        }
      } catch (error) {
        status.textContent = "网络错误或服务未响应";
        status.style.color = "red";
      }
    }
  </script>
</body>
</html>
