<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>更新数字</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    input {
      font-size: 2em;
      width: 200px;
      text-align: center;
    }
    button {
      font-size: 1.2em;
      margin-top: 1em;
      padding: 0.5em 1em;
    }
    #status {
      margin-top: 1em;
      font-size: 1em;
      color: green;
    }
  </style>
</head>
<body>
  <input type="text" id="number" placeholder="输入六位数字" maxlength="6" />
  <button onclick="updateData()">更新</button>
  <div id="status"></div>

  <script>
    const token = "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";  // 保密使用
    const username = "leahxl";
    const repo = "live-code-display";
    const filePath = "data.json";

    async function updateData() {
      const input = document.getElementById("number").value;
      const status = document.getElementById("status");
      if (!/^\d{1,6}$/.test(input)) {
        status.textContent = "请输入1~6位数字。";
        status.style.color = "red";
        return;
      }

      // 获取文件的 SHA
      const res1 = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${filePath}`, {
        headers: {
          Authorization: `token ${token}`,
        },
      });
      const file = await res1.json();

      // 更新文件
      const content = btoa(JSON.stringify({ value: input }, null, 2));
      const res2 = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${filePath}`, {
        method: "PUT",
        headers: {
          Authorization: `token ${token}`,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          message: "自动更新 data.json",
          content: content,
          sha: file.sha,
        }),
      });

      if (res2.ok) {
        status.textContent = "更新成功！";
        status.style.color = "green";
      } else {
        status.textContent = "更新失败。请检查网络或权限。";
        status.style.color = "red";
      }
    }
  </script>
</body>
</html>
